<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor | Intro component with sign up form</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[hsl(0,100%,74%)] bg-cover bg-center min-h-screen flex items-center justify-center p-6 font-['Poppins',sans-serif]">
  
  <!-- Main Container -->
  <main class="w-full max-w-6xl mx-auto flex flex-col lg:flex-row items-center gap-12 lg:gap-16 py-12">
    
    <div class="text-white text-center lg:text-left lg:w-1/2 flex flex-col gap-6">
      <h1 class="text-3xl md:text-5xl font-bold leading-tight tracking-tight">
        Learn to code by watching others
      </h1>
      <p class="font-medium text-[15px] md:text-base leading-relaxed opacity-90">
        See how experienced developers solve problems in real-time. Watching scripted tutorials is great, 
        but understanding how developers think is invaluable.
      </p>
    </div>

    <div class="w-full lg:w-1/2 flex flex-col gap-6 max-w-md mx-auto lg:max-w-none lg:mx-0">
      
      <!-- Offer Banner -->
      <div class="bg-[hsl(248,32%,49%)] text-white rounded-xl shadow-[0_8px_0_0_rgba(0,0,0,0.15)] p-4 text-center">
        <p class="text-[15px]"><span class="font-bold">Try it free 7 days</span> then $20/mo. thereafter</p>
      </div>

      <!-- Signup Form -->
      <form class="bg-white rounded-xl shadow-[0_8px_0_0_rgba(0,0,0,0.15)] p-6 md:p-10 flex flex-col gap-4">
        
      
        <input type="text" placeholder="First Name" required 
          class="w-full border border-[hsl(246,25%,77%)] rounded-md p-4 text-sm font-semibold text-[hsl(249,10%,26%)] focus:outline-none focus:border-[hsl(248,32%,49%)] focus:ring-1 focus:ring-[hsl(248,32%,49%)] placeholder:font-medium placeholder:text-[hsl(249,10%,26%,0.5)]">
        
        <input type="text" placeholder="Last Name" required 
          class="w-full border border-[hsl(246,25%,77%)] rounded-md p-4 text-sm font-semibold text-[hsl(249,10%,26%)] focus:outline-none focus:border-[hsl(248,32%,49%)] focus:ring-1 focus:ring-[hsl(248,32%,49%)] placeholder:font-medium placeholder:text-[hsl(249,10%,26%,0.5)]">
        
        <input type="email" placeholder="Email Address" required 
          class="w-full border border-[hsl(246,25%,77%)] rounded-md p-4 text-sm font-semibold text-[hsl(249,10%,26%)] focus:outline-none focus:border-[hsl(248,32%,49%)] focus:ring-1 focus:ring-[hsl(248,32%,49%)] placeholder:font-medium placeholder:text-[hsl(249,10%,26%,0.5)]">
        
        <input type="password" placeholder="Password" required 
          class="w-full border border-[hsl(246,25%,77%)] rounded-md p-4 text-sm font-semibold text-[hsl(249,10%,26%)] focus:outline-none focus:border-[hsl(248,32%,49%)] focus:ring-1 focus:ring-[hsl(248,32%,49%)] placeholder:font-medium placeholder:text-[hsl(249,10%,26%,0.5)]">
        
        <!-- Submit Button -->
        <button type="submit" class="w-full bg-[hsl(154,59%,51%)] hover:bg-[hsl(154,59%,60%)] transition-colors duration-200 text-white font-semibold uppercase tracking-widest text-[15px] py-4 rounded-md shadow-[0_4px_0_0_rgba(46,204,113,0.5)] mt-2 cursor-pointer">
          Claim your free trial
        </button>
        
       
        <p class="text-[11px] text-[hsl(246,25%,77%)] text-center mt-2 px-2 font-medium">
          By clicking the button, you are agreeing to our 
          <a href="#" class="text-[hsl(0,100%,74%)] font-bold hover:underline">Terms and Services</a>
        </p>
      </form>

    </div>
  </main>

</body>
</html>
